[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "openmeteo"
version = "0.1.1"
description = "Client for communication with OpenMeteo platform."
authors = [
    { name="Klemen Bregar", email="klemen.bregar@comsensus.eu" }
]
license = { text = "Apache-2.0" }
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "pandas>=2.1",
    "requests>=2.32.1",
]

[project.urls]
Homepage = "https://gitlab.comsensus.eu/comsensus-sw/ems/openmeteo.git"
Repository = "https://gitlab.comsensus.eu/comsensus-sw/ems/openmeteo.git"
Issues = "https://gitlab.comsensus.eu/comsensus-sw/ems/openmeteo.git"